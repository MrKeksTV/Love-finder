<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Discord Klon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: #dbdee1;
            overflow: hidden;
        }

        /* Server-Leiste ganz links */
        .server-sidebar {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: #313338;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: bold;
            color: #313338;
        }

        .server-icon.discord-home {
            background-color: #5865f2;
            color: white;
            border-radius: 16px;
        }

        .server-icon:hover {
            border-radius: 16px;
            background-color: #5865f2;
            color: white;
        }

        /* Kanal-Leiste */
        .channel-sidebar {
            width: 240px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            height: 48px;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-weight: bold;
            color: white;
        }

        .channels-list {
            padding: 8px;
            flex-grow: 1;
        }

        .channel-item {
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .channel-item:hover, .channel-item.active {
            background-color: #35373c;
            color: #f2f3f5;
        }

        .channel-item::before {
            content: "# ";
            font-weight: bold;
            margin-right: 6px;
            color: #80848e;
        }

        /* User-Bereich unten links */
        .user-panel {
            height: 52px;
            background-color: #232428;
            display: flex;
            align-items: center;
            padding: 0 8px;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #5865f2;
            border-radius: 50%;
        }

        /* Haupt-Chatbereich */
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            height: 48px;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-weight: bold;
            color: white;
        }

        .messages-area {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 16px;
        }

        .message-content h4 {
            color: white;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .message-content p {
            font-size: 15px;
            color: #dbdee1;
        }

        /* Eingabefeld */
        .input-area {
            padding: 0 16px 24px 16px;
        }

        .message-input {
            width: 100%;
            padding: 11px;
            background-color: #383a40;
            border: none;
            border-radius: 8px;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="server-sidebar">
        <div class="server-icon discord-home">D</div>
    </div>

    <div class="channel-sidebar">
        <div class="server-header">Globaler Chatroom</div>
        <div class="channels-list">
            <div class="channel-item active">chat-mit-freunden</div>
        </div>
        <div class="user-panel">
            <div class="user-info">
                <div class="avatar" id="userAvatar"></div>
                <div>
                    <div id="usernameDisplay" style="font-size: 14px; font-weight: bold; color: white;">Lade...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header"># chat-mit-freunden</div>
        <div class="messages-area" id="chatMessages">
            <!-- Nachrichten landen hier in Echtzeit -->
        </div>
        <div class="input-area">
            <input type="text" class="message-input" id="msgInput" placeholder="Nachricht senden...">
        </div>
    </div>

    <!-- Firebase SDKs einbinden -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onChildAdded } from "https://gstatic.com";

        // 1. HIER DEINE EIGENEN FIREBASE CONFIG-DATEN EINTRAGEN
        const firebaseConfig = {
            apiKey: "DEIN_API_KEY",
            authDomain: "DEIN_://firebaseapp.com",
            databaseURL: "https://DEIN_://firebaseio.com",
            projectId: "DEIN_PROJECT",
            storageBucket: "DEIN_://appspot.com",
            messagingSenderId: "DEINE_ID",
            appId: "DEIN_APP_ID"
        };

        // Firebase initialisieren
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, "messages");

        // 2. Benutzernamen festlegen oder abfragen
        let myUsername = localStorage.getItem("chat_username");
        if (!myUsername) {
            myUsername = prompt("Gib deinen Chat-Namen für deine Freunde ein:") || "AnonymerGamer";
            localStorage.setItem("chat_username", myUsername);
        }
        
        // Zufällige Farbe für den eigenen Avatar generieren
        let myColor = localStorage.getItem("chat_color");
        if (!myColor) {
            myColor = "#" + Math.floor(Math.random()*16777215).toString(16);
            localStorage.setItem("chat_color", myColor);
        }

        document.getElementById("usernameDisplay").innerText = myUsername;
        document.getElementById("userAvatar").style.backgroundColor = myColor;

        // 3. Nachricht an Firebase senden, wenn Enter gedrückt wird
        const input = document.getElementById('msgInput');
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                push(messagesRef, {
                    username: myUsername,
                    text: input.value,
                    color: myColor,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        });

        // 4. In Echtzeit auf neue Nachrichten vom Server lauschen (von allen Geräten)
        const chatMessages = document.getElementById('chatMessages');
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            
            const newMessage = document.createElement('div');
            newMessage.className = 'message';
            newMessage.innerHTML = `
                <div class="avatar" style="background-color: ${data.color || '#5865f2'};"></div>
                <div class="message-content">
                    <h4>${escapeHTML(data.username)}</h4>
                    <p>${escapeHTML(data.text)}</p>
                </div>
            `;
            
            chatMessages.appendChild(newMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Automatisch nach unten scrollen
        });

        function escapeHTML(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
