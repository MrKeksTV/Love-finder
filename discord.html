<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web Klon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: #dbdee1;
            overflow: hidden;
        }

        /* 1. Server-Leiste ganz links */
        .server-sidebar {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: #313338;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: bold;
            color: #313338;
        }

        .server-icon.discord-home {
            background-color: #5865f2;
            color: white;
            border-radius: 16px;
        }

        .server-icon:hover {
            border-radius: 16px;
            background-color: #5865f2;
            color: white;
        }

        /* 2. Kanal-Leiste */
        .channel-sidebar {
            width: 240px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            height: 48px;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-weight: bold;
            color: white;
        }

        .channels-list {
            padding: 8px;
            flex-grow: 1;
        }

        .channel-item {
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .channel-item:hover, .channel-item.active {
            background-color: #35373c;
            color: #f2f3f5;
        }

        .channel-item::before {
            content: "# ";
            font-weight: bold;
            margin-right: 6px;
            color: #80848e;
        }

        /* User-Bereich unten links */
        .user-panel {
            height: 52px;
            background-color: #232428;
            display: flex;
            align-items: center;
            padding: 0 8px;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #5865f2;
            border-radius: 50%;
        }

        /* 3. Haupt-Chatbereich */
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            height: 48px;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-weight: bold;
            color: white;
        }

        .messages-area {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 16px;
        }

        .message-content h4 {
            color: white;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .message-content p {
            font-size: 15px;
            color: #dbdee1;
        }

        /* Eingabefeld */
        .input-area {
            padding: 0 16px 24px 16px;
        }

        .message-input {
            width: 100%;
            padding: 11px;
            background-color: #383a40;
            border: none;
            border-radius: 8px;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }

        .message-input::placeholder {
            color: #6d6f78;
        }
    </style>
</head>
<body>

    <!-- 1. Server-Sidebar -->
    <div class="server-sidebar">
        <div class="server-icon discord-home">D</div>
        <div style="width: 32px; height: 2px; background: #35373c; margin: 4px 0;"></div>
        <div class="server-icon" style="background-color: #e3e5e8;">G1</div>
        <div class="server-icon" style="background-color: #e3e5e8;">G2</div>
    </div>

    <!-- 2. Channel-Sidebar -->
    <div class="channel-sidebar">
        <div class="server-header">Mein Gaming Server</div>
        <div class="channels-list">
            <div class="channel-item active">willkommen</div>
            <div class="channel-item">allgemein</div>
            <div class="channel-item">memes</div>
            <div class="channel-item">bot-spam</div>
        </div>
        <div class="user-panel">
            <div class="user-info">
                <div class="avatar"></div>
                <div>
                    <div style="font-size: 14px; font-weight: bold; color: white;">GamerPro</div>
                    <div style="font-size: 12px; color: #949ba4;">#0001</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Chat-Bereich -->
    <div class="chat-container">
        <div class="chat-header"># allgemein</div>
        <div class="messages-area" id="chatMessages">
            <div class="message">
                <div class="avatar" style="background-color: #23a55a;"></div>
                <div class="message-content">
                    <h4>Admin_Max</h4>
                    <p>Willkommen auf unserem neuen HTML-Discord-Klon! Schaut euch gerne um.</p>
                </div>
            </div>
            <div class="message">
                <div class="avatar" style="background-color: #f0b232;"></div>
                <div class="message-content">
                    <h4>ZockerOpa</h4>
                    <p>Sieht echt mega aus! Kann man hier schon Nachrichten schreiben?</p>
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" class="message-input" id="msgInput" placeholder="Nachricht an #allgemein">
        </div>
    </div>

    <!-- JavaScript für die Chat-Interaktion -->
    <script>
        const input = document.getElementById('msgInput');
        const chatMessages = document.getElementById('chatMessages');

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                // Neue Nachricht erstellen
                const newMessage = document.createElement('div');
                newMessage.className = 'message';
                newMessage.innerHTML = `
                    <div class="avatar" style="background-color: #5865f2;"></div>
                    <div class="message-content">
                        <h4>GamerPro (Du)</h4>
                        <p>${escapeHTML(input.value)}</p>
                    </div>
                `;
                
                // Nachricht hinzufügen und scrollen
                chatMessages.appendChild(newMessage);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                // Input leeren
                input.value = '';
            }
        });

        // Schutz gegen XSS-Angriffe
        function escapeHTML(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
