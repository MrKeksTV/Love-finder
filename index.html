<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPadOS Pro - Multi-User Edition</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --safari-blue: #007AFF;
            --ios-bg: #1c1c1e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #ipad-container { width: 100vw; height: 100vh; background: url('https://unsplash.com') center/cover; position: relative; overflow: hidden; }
        
        /* Lockscreen & Auth */
        #lockscreen { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: transform 0.5s ease; }
        .lock-time { font-size: 80px; font-weight: 200; }
        .lock-date { font-size: 24px; font-weight: 400; margin-bottom: 40px; }
        .auth-card { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); width: 320px; text-align: center; }
        .auth-card h3 { margin-bottom: 20px; font-weight: 500; }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: white; outline: none; }
        .auth-card input::placeholder { color: #ddd; }
        .auth-card button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; background: var(--safari-blue); color: white; font-weight: bold; cursor: pointer; }
        .auth-btn-sec { background: transparent !important; border: 1px solid rgba(255,255,255,0.4) !important; font-size: 14px; margin-top: 5px !important; }
        .error-msg { color: #ff453a; font-size: 14px; margin-top: 10px; min-height: 20px; }

        /* Status Bar */
        #status-bar { width: 100%; height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; color: white; font-size: 14px; font-weight: 500; position: absolute; top: 0; z-index: 999; }
        .status-right i { margin-left: 8px; }

        /* Homescreen */
        #homescreen { width: 100%; height: 100%; padding-top: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 100px)); grid-template-rows: repeat(auto-fill, minmax(110px, 110px)); gap: 25px; padding-left: 40px; box-sizing: border-box; align-content: flex-start; }
        .app-icon-wrapper { width: 100px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .app-icon { width: 70px; height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; box-shadow: 0 8px 15px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .app-icon-wrapper span { color: white; font-size: 12px; margin-top: 8px; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Wiggle Animation */
        @keyframes wiggle { 0% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } 100% { transform: rotate(-2deg); } }
        .wiggle .app-icon { animation: wiggle 0.25s infinite ease-in-out; }
        .delete-badge { position: absolute; top: 0; left: 10px; background: #ff453a; color: white; border-radius: 50%; width: 22px; height: 22px; display: none; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 1.5px solid white; }
        .wiggle .delete-badge { display: flex; }

        /* Dock */
        #dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.25); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 30px; display: flex; gap: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); z-index: 900; }
        #dock .app-icon-wrapper { height: auto; }
        #dock .app-icon-wrapper span { display: none; }

        /* Windows */
        .window { position: absolute; top: 50px; left: 50px; width: 800px; height: 550px; background: var(--ios-bg); border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; z-index: 100; color: white; resize: both; }
        .window-header { height: 45px; background: #2c2c2e; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; cursor: move; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .window-title { font-weight: 600; font-size: 15px; }
        .window-controls { display: flex; gap: 8px; }
        .control-btn { width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; }
        .btn-close { background: #ff5f56; }
        .btn-minimize { background: #ffbd2e; }
        .btn-maximize { background: #27c93f; }
        .window-content { flex: 1; position: relative; overflow: auto; }

        /* Specific App Styles */
        .app-table { width: 100%; border-collapse: collapse; background: #2c2c2e; color: white; }
        .app-table th, .app-table td { padding: 12px; border: 1px solid #3a3a3c; text-align: left; }
        .app-table th { background: #1c1c1e; }
    </style>
</head>
<body>

<div id="ipad-container">
    <!-- Status Bar -->
    <div id="status-bar">
        <div class="status-left" id="status-time">12:00</div>
        <div class="status-right">
            <span id="current-user-display" style="margin-right:15px; color:#007AFF;"></span>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- Lockscreen / Login -->
    <div id="lockscreen">
        <div class="lock-time" id="lock-time">12:00</div>
        <div class="lock-date" id="lock-date">Freitag, 22. Mai</div>
        
        <!-- Login Card -->
        <div class="auth-card" id="login-card">
            <h3 id="auth-title">Anmelden</h3>
            <input type="text" id="auth-user" placeholder="Benutzername">
            <input type="password" id="auth-pass" placeholder="Passwort">
            <button onclick="handleAuth()">Einloggen</button>
            <button class="auth-btn-sec" onclick="toggleAuthMode(true)">Neuen Account erstellen</button>
            <button class="auth-btn-sec" onclick="openChangePasswordModal()">Passwort ändern</button>
            <div class="error-msg" id="auth-error"></div>
        </div>
    </div>

    <!-- Homescreen Apps Area -->
    <div id="homescreen" oncontextmenu="handleRightClick(event)"></div>

    <!-- Dock Area -->
    <div id="dock"></div>

    <!-- WINDOW: Dev Logs (Jonas Mode) -->
    <div class="window" id="win-devlogs">
        <div class="window-header" onmousedown="dragStart(event, 'win-devlogs')">
            <div class="window-title"><i class="fas fa-database"></i> Jonas Developer Logs</div>
            <div class="window-controls">
                <button class="control-btn btn-close" onclick="closeApp('win-devlogs')"></button>
            </div>
        </div>
        <div class="window-content" style="padding: 20px;">
            <h3>Registrierte User & Passwörter</h3>
            <br>
            <table class="app-table">
                <thead>
                    <tr><th>User</th><th>Passwort</th></tr>
                </thead>
                <tbody id="dev-logs-table-body"></tbody>
            </table>
        </div>
    </div>
    <!-- WINDOW: WhatsApp -->
    <div class="window" id="win-whatsapp" style="width: 850px; height: 580px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-whatsapp')">
            <div class="window-title"><i class="fab fa-whatsapp"></i> WhatsApp Business</div>
            <div class="window-controls">
                <button class="control-btn btn-close" onclick="closeApp('win-whatsapp')"></button>
            </div>
        </div>
        <div class="window-content" style="display: flex; background: #0b141a;">
            <!-- Left Panel -->
            <div style="width: 30%; border-right: 1px solid #222e35; display: flex; flex-direction: column; background: #111b21;">
                <div style="padding: 10px; background: #202c33; display: flex; flex-direction: column; gap: 8px;">
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="wa-search-user" placeholder="User suchen..." style="flex:1; padding: 6px; background:#2a3942; border:none; border-radius:5px; color:white;">
                        <button onclick="sendFriendRequest()" style="padding:6px; background:#00a884; border:none; border-radius:5px; color:white; font-weight:bold;">Add</button>
                    </div>
                    <div style="font-size:11px; color:#8696a0;" id="wa-search-status"></div>
                </div>
                <!-- Requests Section -->
                <div style="padding: 5px 10px; background: #222e35; font-size:12px; color:#8696a0;">Anfragen:</div>
                <div id="wa-requests-list" style="max-height: 100px; overflow-y:auto; border-bottom:1px solid #222e35;"></div>
                <!-- Chats Section -->
                <div style="padding: 5px 10px; background: #222e35; font-size:12px; color:#8696a0;">Chats:</div>
                <div id="wa-chats-list" style="flex:1; overflow-y: auto;"></div>
            </div>
            <!-- Right Chat Window -->
            <div style="width: 70%; display: flex; flex-direction: column;" id="wa-chat-area">
                <div style="padding: 15px; background: #202c33; font-weight: bold;" id="wa-active-chat-title">Wähle einen Chat</div>
                <div id="wa-messages-box" style="flex: 1; padding: 20px; overflow-y: auto; background: url('https://githubusercontent.com') repeat;"></div>
                <div style="padding: 10px; background: #202c33; display: flex; gap: 10px;" id="wa-input-box-wrapper">
                    <input type="text" id="wa-msg-input" placeholder="Nachricht schreiben..." style="flex: 1; padding: 10px; background: #2a3942; border: none; border-radius: 8px; color: white;">
                    <button onclick="sendWhatsAppMessage()" style="padding: 10px 20px; background: #00a884; border: none; border-radius: 8px; color: white; font-weight: bold;">Senden</button>
                </div>
            </div>
        </div>
    </div>

    <!-- WINDOW: Taschenrechner -->
    <div class="window" id="win-calc" style="width: 300px; height: 420px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-calc')">
            <div class="window-title"><i class="fas fa-calculator"></i> Rechner</div>
            <div class="window-controls"><button class="control-btn btn-close" onclick="closeApp('win-calc')"></button></div>
        </div>
        <div class="window-content" style="background:#000; padding:10px; display:flex; flex-direction:column; justify-content:flex-end;">
            <div id="calc-screen" style="font-size:40px; text-align:right; margin-bottom:10px; padding-right:10px;">0</div>
            <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;">
                <button onclick="clearCalc()" style="background:#a5a5a5; color:black; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold;">C</button>
                <button style="background:#a5a5a5; color:black; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold; visibility:hidden;"></button>
                <button style="background:#a5a5a5; color:black; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold; visibility:hidden;"></button>
                <button onclick="pressCalc('/')" style="background:#ff9f0a; color:white; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold;">÷</button>
                <button onclick="pressCalc('7')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">7</button>
                <button onclick="pressCalc('8')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">8</button>
                <button onclick="pressCalc('9')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">9</button>
                <button onclick="pressCalc('*')" style="background:#ff9f0a; color:white; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold;">×</button>
                <button onclick="pressCalc('4')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">4</button>
                <button onclick="pressCalc('5')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">5</button>
                <button onclick="pressCalc('6')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">6</button>
                <button onclick="pressCalc('-')" style="background:#ff9f0a; color:white; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold;">-</button>
                <button onclick="pressCalc('1')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">1</button>
                <button onclick="pressCalc('2')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">2</button>
                <button onclick="pressCalc('3')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">3</button>
                <button onclick="pressCalc('+')" style="background:#ff9f0a; color:white; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold;">+</button>
                <button onclick="pressCalc('0')" style="background:#333; color:white; height:50px; border-radius:10px; border:none; font-size:20px; grid-column: span 2;">0</button>
                <button onclick="pressCalc('.')" style="background:#333; color:white; height:50px; border-radius:50%; border:none; font-size:20px;">.</button>
                <button onclick="calculateResult()" style="background:#ff9f0a; color:white; height:50px; border-radius:50%; border:none; font-size:20px; font-weight:bold;">=</button>
            </div>
        </div>
    </div>

    <!-- WINDOW: Tic-Tac-Toe -->
    <div class="window" id="win-ttt" style="width: 350px; height: 420px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-ttt')">
            <div class="window-title"><i class="fas fa-gamepad"></i> Tic-Tac-Toe</div>
            <div class="window-controls"><button class="control-btn btn-close" onclick="closeApp('win-ttt')"></button></div>
        </div>
        <div class="window-content" style="padding:15px; text-align:center; background:#1c1c1e;">
            <div id="ttt-status" style="margin-bottom:15px; font-weight:bold;">Spieler X ist dran</div>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-width:240px; margin:0 auto;" id="ttt-board"></div>
            <button onclick="resetTTT()" style="margin-top:20px; padding:8px 15px; background:#007AFF; border:none; border-radius:5px; color:white; font-weight:bold;">Neu starten</button>
        </div>
    </div>
</div>

<script>
    // System & State Management
    let isRegisterMode = false;
    let currentUser = null;
    let activeChatUser = null;
    let apps = [
        { id: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp', color: '#25D366', winId: 'win-whatsapp', isDock: true },
        { id: 'calc', name: 'Rechner', icon: 'fas fa-calculator', color: '#ff9f0a', winId: 'win-calc', isDock: false },
        { id: 'ttt', name: 'Tic-Tac-Toe', icon: 'fas fa-gamepad', color: '#5856D6', winId: 'win-ttt', isDock: false }
    ];

    // Initialize System
    function initClock() {
        const updateTime = () => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('status-time').innerText = timeStr;
            if(document.getElementById('lock-time')) document.getElementById('lock-time').innerText = timeStr;
        };
        setInterval(updateTime, 1000); updateTime();
    }
    initClock();

    // Authentication Engine (Safe Account Creation & Checking)
    function toggleAuthMode(reg) {
        isRegisterMode = reg;
        document.getElementById('auth-title').innerText = reg ? "Registrieren" : "Anmelden";
        document.getElementById('auth-error').innerText = "";
    }

    function handleAuth() {
        const user = document.getElementById('auth-user').value.trim();
        const pass = document.getElementById('auth-pass').value.trim();
        const err = document.getElementById('auth-error');
        
        if(!user || !pass) { err.innerText = "Felder ausfüllen!"; return; }
        let users = JSON.parse(localStorage.getItem('ipad_users') || '{}');

        if(isRegisterMode) {
            if(users[user]) { err.innerText = "Nutzer existiert bereits!"; return; }
            users[user] = pass;
            localStorage.setItem('ipad_users', JSON.stringify(users));
err.style.color = "#27c93f"; err.innerText = "Registriert! Logge dich jetzt ein.";
toggleAuthMode(false);
} else {
if(!users[user] || users[user] !== pass) {
err.style.color = "#ff453a"; err.innerText = "Nutzer und Passwort existieren nicht!"; return;
}
// Login Success
currentUser = user;
document.getElementById('current-user-display').innerText = 👤 ${user};
document.getElementById('lockscreen').style.transform = "translateY(-100%)";
loadHomescreen();
}
}
function openChangePasswordModal() {
const user = prompt("Benutzername eingeben:");
const oldPass = prompt("Altes Passwort eingeben:");
let users = JSON.parse(localStorage.getItem('ipad_users') || '{}');
if(!users[user] || users[user] !== oldPass) { alert("Falsche Daten!"); return; }
const newPass = prompt("Neues Passwort eingeben:");
if(newPass) { users[user] = newPass; localStorage.setItem('ipad_users', JSON.stringify(users)); alert("Passwort erfolgreich geändert!"); }
}
// Build Interfaces
function loadHomescreen() {
const hs = document.getElementById('homescreen');
const dk = document.getElementById('dock');
hs.innerHTML = ""; dk.innerHTML = "";
let appsToRender = [...apps];
if(currentUser.toLowerCase() === 'jonas') {
if(!appsToRender.find(a => a.id === 'devlogs')) {
appsToRender.push({ id: 'devlogs', name: 'Dev Logs', icon: 'fas fa-database', color: '#3a3a3c', winId: 'win-devlogs', isDock: false });
renderDevLogs();
}
}
appsToRender.forEach(app => {
const html = <div class="app-icon-wrapper" onclick="openApp('${app.winId}')"> <div class="app-icon" style="background:${app.color}"><i class="${app.icon}"></i></div> <span>${app.name}</span> </div>;
if(app.isDock) dk.innerHTML += html; else hs.innerHTML += html;
});
initWhatsAppSystem();
}
function openApp(id) { document.getElementById(id).style.display = 'flex'; zIndexUp(id); }
function closeApp(id) { document.getElementById(id).style.display = 'none'; }
let topZ = 100;
function zIndexUp(id) { topZ++; document.getElementById(id).style.zIndex = topZ; }
function renderDevLogs() {
const tbody = document.getElementById('dev-logs-table-body');
tbody.innerHTML = "";
let users = JSON.parse(localStorage.getItem('ipad_users') || '{}');
Object.keys(users).forEach(u => {
tbody.innerHTML += <tr><td>${u}</td><td><code>${users[u]}</code></td></tr>;
});
}
// WhatsApp Engine (Friend Requests & Scoped Messages)
function initWhatsAppSystem() {
loadWhatsAppSidebar();
setInterval(loadWhatsAppSidebar, 4000); // Live Reload System
}
function loadWhatsAppSidebar() {
let reqs = JSON.parse(localStorage.getItem('wa_reqs_' + currentUser) || '[]');
let friends = JSON.parse(localStorage.getItem('wa_friends_' + currentUser) || '[]');
const reqBox = document.getElementById('wa-requests-list');
reqBox.innerHTML = reqs.length === 0 ? 'Keine Anfragen' : '';
reqs.forEach(sender => {
reqBox.innerHTML += <div style="padding:8px 10px; display:flex; justify-content:space-between; align-items:center; background:#202c33; margin-bottom:2px;"> <span>${sender}</span> <button onclick="acceptFriendRequest('${sender}')" style="background:#00a884; border:none; padding:3px 8px; color:white; border-radius:3px;">Ok</button> </div>;
});
const chatBox = document.getElementById('wa-chats-list');
chatBox.innerHTML = friends.length === 0 ? 'Noch keine Chats. Füge oben User hinzu!' : '';
friends.forEach(f => {
chatBox.innerHTML += <div onclick="openChatWith('${f}')" style="padding:12px; border-bottom:1px solid #222e35; cursor:pointer; background:${activeChatUser === f ? '#2a3942' : 'transparent'};"> <div style="font-weight:bold;">${f}</div> <div style="font-size:12px; color:#8696a0;">Chat öffnen...</div> </div>;
});
if(activeChatUser) loadActiveMessages();
}
function sendFriendRequest() {
const target = document.getElementById('wa-search-user').value.trim();
const stat = document.getElementById('wa-search-status');
let users = JSON.parse(localStorage.getItem('ipad_users') || '{}');
if(!users[target]) { stat.innerText = "User existiert nicht!"; return; }
if(target === currentUser) { stat.innerText = "Du kannst dich nicht selbst adden."; return; }
let targetReqs = JSON.parse(localStorage.getItem('wa_reqs_' + target) || '[]');
if(!targetReqs.includes(currentUser)) {
targetReqs.push(currentUser);
localStorage.setItem('wa_reqs_' + target, JSON.stringify(targetReqs));
}
stat.innerText = "Anfrage an " + target + " gesendet!";
}
function acceptFriendRequest(sender) {
let reqs = JSON.parse(localStorage.getItem('wa_reqs_' + currentUser) || '[]');
reqs = reqs.filter(u => u !== sender);
localStorage.setItem('wa_reqs_' + currentUser, JSON.stringify(reqs));
let myFriends = JSON.parse(localStorage.getItem('wa_friends_' + currentUser) || '[]');
if(!myFriends.includes(sender)) myFriends.push(sender);
localStorage.setItem('wa_friends_' + currentUser, JSON.stringify(myFriends));
let theirFriends = JSON.parse(localStorage.getItem('wa_friends_' + sender) || '[]');
if(!theirFriends.includes(currentUser)) theirFriends.push(currentUser);
localStorage.setItem('wa_friends_' + sender, JSON.stringify(theirFriends));
loadWhatsAppSidebar();
}
function openChatWith(user) { activeChatUser = user; loadWhatsAppSidebar(); }
function loadActiveMessages() {
document.getElementById('wa-active-chat-title').innerText = activeChatUser;
const box = document.getElementById('wa-messages-box');
let chatKey = [currentUser, activeChatUser].sort().join('chat');
let msgs = JSON.parse(localStorage.getItem(chatKey) || '[]');
box.innerHTML = "";
msgs.forEach(m => {
const isMe = m.sender === currentUser;
box.innerHTML += <div style="display:flex; justify-content:${isMe ? 'flex-end' : 'flex-start'}; margin-bottom:8px;"> <div style="background:${isMe ? '#005c4b' : '#202c33'}; color:white; padding:8px 12px; border-radius:8px; max-width:70%; word-break:break-all;"> ${m.text} </div> </div>;
});
box.scrollTop = box.scrollHeight;
}
function sendWhatsAppMessage() {
const inp = document.getElementById('wa-msg-input');
if(!inp.value.trim() || !activeChatUser) return;
let chatKey = [currentUser, activeChatUser].sort().join('chat');
let msgs = JSON.parse(localStorage.getItem(chatKey) || '[]');
msgs.push({ sender: currentUser, text: inp.value.trim() });
