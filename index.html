<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen iPad Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Modernes iPad-Gehäuse mit dünnem Rahmen */
        #ipad {
            width: 1024px;
            height: 720px;
            background: #0d0d0d;
            border-radius: 40px;
            padding: 16px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
            position: relative;
            border: 2px solid #333;
        }

        /* Liquid Retina Display */
        #screen {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200') center/cover;
            border-radius: 26px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Dynamische Statusleiste */
        #status-bar {
            height: 35px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            background: rgba(0,0,0,0.05);
        }

        /* Home-Screen Layout mit echtem Grid */
        #homescreen {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-gap: 30px;
            padding: 50px 60px;
            flex-grow: 1;
            align-content: flex-start;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .app-icon:hover {
            transform: scale(1.05);
        }

        .app-icon:active {
            transform: scale(0.95);
        }

        .app-icon img {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            margin-bottom: 10px;
            object-fit: cover;
        }

        .app-icon span {
            color: white;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* Schwebendes iOS 17/18 Dock */
        #dock-container {
            width: 100%;
            display: flex;
            justify-content: center;
            position: absolute;
            bottom: 20px;
            z-index: 999;
        }

        #dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 12px 24px;
            border-radius: 28px;
            display: flex;
            gap: 18px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
        }

        #dock .app-icon img {
            width: 68px;
            height: 68px;
            margin-bottom: 0;
        }

        /* App-Fenster (Stage Manager Style) */
        .app-window {
            position: absolute;
            top: 60px;
            left: 80px;
            width: 800px;
            height: 540px;
            background: #ffffff;
            border-radius: 16px;
            z-index: 100;
            display: none;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,0,0,0.15);
            overflow: hidden;
            transform: scale(0.9);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.1, 0.8, 0.25, 1), opacity 0.25s;
        }

        .app-window.active {
            transform: scale(1);
            opacity: 1;
        }

        /* Fenster Header */
        .app-header {
            height: 52px;
            background: #f1f2f6;
            border-bottom: 1px solid #e1e2e6;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            cursor: move;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .win-btn {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        .win-close { background: #ff5f56; }
        .win-min { background: #ffbd2e; }

        .app-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .app-content {
            flex-grow: 1;
            overflow: auto;
            position: relative;
        }

        /* App Store Design */
        .store-banner {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 25px;
            color: white;
            border-radius: 14px;
            margin-bottom: 25px;
        }
        .store-shelf {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .store-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #eee;
        }
        .store-item-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .store-item img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-get {
            background: #007aff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-get:hover { background: #0063cc; }
        .btn-get.installed { background: #e5e5ea; color: #8e8e93; cursor: default; }

        /* Game UI */
        .game-wrapper {
            background: #111;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #1a1a1a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        /* Home-Indicator Balken unten */
        #home-bar {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 5px;
            background: rgba(255,255,255,0.7);
            border-radius: 10px;
            z-index: 1000;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="ipad">
    <div id="screen">
        
        <!-- Status Bar -->
        <div id="status-bar">
            <span id="current-time">09:41</span>
            <div style="display:flex; gap: 10px; font-size: 14px;">
                <span>⚡</span>
                <span>📶</span>
                <span>🔋 99%</span>
            </div>
        </div>

        <!-- Homescreen Grid -->
        <div id="homescreen">
            <div class="app-icon" onclick="openWindow('safari')">
                <img src="https://cdn-icons-png.flaticon.com/512/300/300214.png" alt="Safari">
                <span>Safari</span>
            </div>
            <div class="app-icon" onclick="openWindow('notes')">
                <img src="https://cdn-icons-png.flaticon.com/512/889/889649.png" alt="Notizen">
                <span>Notizen</span>
            </div>
            <!-- Hier spawnen geladene Apps -->
            <div id="installed-apps" style="display: contents;"></div>
        </div>

        <!-- Schwebendes Dock -->
        <div id="dock-container">
            <div id="dock">
                <div class="app-icon" onclick="openWindow('safari')"><img src="https://cdn-icons-png.flaticon.com/512/300/300214.png"></div>
                <div class="app-icon" onclick="openWindow('appstore')"><img src="https://cdn-icons-png.flaticon.com/512/512/512395.png"></div>
            </div>
        </div>

        <!-- Home Bar -->
        <div id="home-bar" onclick="closeAllApps()"></div>

        <!-- ---------------- APPS FENSTER ---------------- -->

        <!-- SAFARI -->
        <div id="win-safari" class="app-window">
            <div class="app-header">
                <div class="window-controls">
                    <button class="win-btn win-close" onclick="closeWindow('safari')"></button>
                    <button class="win-btn win-min" onclick="closeWindow('safari')"></button>
                </div>
                <div class="app-title">Safari Browser</div>
                <div style="width:26px;"></div>
            </div>
            <div class="app-content">
                <iframe src="https://www.wikipedia.org" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>

        <!-- NOTIZEN -->
        <div id="win-notes" class="app-window">
            <div class="app-header">
                <div class="window-controls">
                    <button class="win-btn win-close" onclick="closeWindow('notes')"></button>
                    <button class="win-btn win-min" onclick="closeWindow('notes')"></button>
                </div>
                <div class="app-title">Notizen</div>
                <div style="width:26px;"></div>
            </div>
            <div class="app-content" style="padding: 24px;">
                <textarea placeholder="Neue Notiz verfassen..." style="width:100%; height:100%; border:none; resize:none; font-size:18px; outline:none; background:transparent;"></textarea>
            </div>
        </div>

        <!-- APP STORE -->
        <div id="win-appstore" class="app-window">
            <div class="app-header">
                <div class="window-controls">
                    <button class="win-btn win-close" onclick="closeWindow('appstore')"></button>
                    <button class="win-btn win-min" onclick="closeWindow('appstore')"></button>
                </div>
                <div class="app-title">App Store</div>
                <div style="width:26px;"></div>
            </div>
            <div class="app-content" style="padding: 24px; background: #fafafa;">
                <div class="store-banner">
                    <h2>Entdecke neue Welten</h2>
                    <p>Exklusive Arcade-Simulationen direkt für dein virtuelles iPad.</p>
                </div>
                <div class="store-shelf">
                    <!-- Spiel 1 -->
                    <div class="store-item">
                        <div class="store-item-info">
                            <img src="https://cdn-icons-png.flaticon.com/512/3313/3313434.png" alt="Space Game">
                            <div>
                                <h4 style="color:#222;">Retro Space Invaders</h4>
                                <p style="color:#666; font-size:13px;">Verteidige das All</p>
                            </div>
                        </div>
                        <button id="btn-space" class="btn-get" onclick="installApp('space', 'Space Arcade', 'https://cdn-icons-png.flaticon.com/512/3313/3313434.png')">LADEN</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- GAME: SPACE ARCADE -->
        <div id="win-space" class="app-window">
            <div class="app-header">
                <div class="window-controls">
                    <button class="win-btn win-close" onclick="closeWindow('space'); stopSpaceGame();"></button>
                    <button class="win-btn win-min" onclick="closeWindow('space'); stopSpaceGame();"></button>
                </div>
                <div class="app-title">Retro Space Invaders</div>
                <div style="width:26px;"></div>
            </div>
            <div class="app-content game-wrapper">
                <div style="position: absolute; top:10px; color:#fff; font-size:12px; font-weight:bold; pointer-events: none;">Pfeiltasten [←] [→] zum Bewegen | [Leertaste] zum Schießen</div>
                <canvas id="spaceCanvas" width="600" height="440"></canvas>
            </div>
        </div>

    </div>
</div>

<script>
    // System-Uhrzeit (2026-Ready)
    function updateClock() {
        const d = new Date();
        document.getElementById('current-time').innerText = d.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Fenster-Manager (Öffnen, Schließen, Z-Index)
    let topZIndex = 100;

    function openWindow(id) {
        const win = document.getElementById(`win-${id}`);
        win.style.display = 'flex';
        topZIndex++;
        win.style.zIndex = topZIndex;
        
        setTimeout(() => {
            win.classList.add('active');
        }, 10);

        if(id === 'space') startSpaceGame();
    }

    function closeWindow(id) {
        const win = document.getElementById(`win-${id}`);
        win.classList.remove('active');
        setTimeout(() => { win.style.display = 'none'; }, 200);
    }

    function closeAllApps() {
        document.querySelectorAll('.app-window').forEach(win => {
            win.classList.remove('active');
            setTimeout(() => { win.style.display = 'none'; }, 200);
        });
        stopSpaceGame();
    }

    // App Store Simulator
    function installApp(id, name, iconUrl) {
        const btn = document.getElementById(`btn-${id}`);
        if(btn.classList.contains('installed')) return;

        btn.innerText = 'Wird installiert...';
        
        setTimeout(() => {
            btn.innerText = 'GEÖFFNET';
            btn.classList.add('installed');

            // Icon auf Homescreen zeichnen
            const container = document.getElementById('installed-apps');
            container.innerHTML += `
                <div class="app-icon" onclick="openWindow('${id}')">
                    <img src="${iconUrl}" alt="${name}">
                    <span>${name}</span>
                </div>
            `;
        }, 1200);
    }

    // --- GAME ENGINE: SPACE INVADERS ---
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let spaceLoopId;
    let player, lasers, enemies, keys, spaceScore, spaceGameOver;

    function startSpaceGame() {
        player = { x: 280, y: 400, w: 40, h: 20, speed: 5 };
        lasers = [];
        enemies = [];
        keys = {};
        spaceScore = 0;
        spaceGameOver = false;

        // Gegner erzeugen
        for(let r=0; r<3; r++) {
            for(let c=0; c<8; c++) {
                enemies.push({ x: 50 + c*60, y: 40 + r*40, w: 30, h: 20, alive: true });
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        
        if(spaceLoopId) cancelAnimationFrame(spaceLoopId);
        runSpaceGame();
    }

    function stopSpaceGame() {
        cancelAnimationFrame(spaceLoopId);
        window.removeEventListener('keydown', handleKeyDown);
        window.removeEventListener('keyup', handleKeyUp);
    }

    function handleKeyDown(e) { keys[e.code] = true; if(e.code === 'Space' && !spaceGameOver) fireLaser(); if(e.code === 'Space' && spaceGameOver) startSpaceGame(); }
    function handleKeyUp(e) { keys[e.code] = false; }

    function fireLaser() {
        lasers.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 10, speed: 7 });
    }

    function runSpaceGame() {
        ctx.clearRect(0,0,canvas.width, canvas.height);

        if(spaceGameOver) {
            ctx.fillStyle = 'white';
            ctx.font = '24px sans-serif';
            ctx.fillText("GAME OVER", 220, 200);
            ctx.font = '16px sans-serif';
            ctx.fillText("Drücke [Leertaste] für Neustart", 180, 240);
            return;
        }

        // Spielersteuerung
        if(keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
        if(keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;

        // Spieler zeichnen
        ctx.fillStyle = '#00afff';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Laser bewegen & zeichnen
        ctx.fillStyle = '#ff4d4d';
        for(let i=lasers.length-1; i>=0; i--) {
            lasers[i].y -= lasers[i].speed;
            ctx.fillRect(lasers[i].x, lasers[i].y, lasers[i].w, lasers[i].h);
            if(lasers[i].y < 0) lasers.splice(i,1);
        }

        // Gegner bewegen & zeichnen
        let activeEnemies = 0;
        ctx.fillStyle = '#2ed573';
        enemies.forEach(enemy => {
            if(!enemy.alive) return;
            activeEnemies++;
            
            // Ganz langsame Abwärtsbewegung
            enemy.y += 0.15;
            ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);

            // Hitbox-Prüfung Laser vs Gegner
            lasers.forEach((laser, lIdx) => {
                if(laser.x > enemy.x && laser.x < enemy.x + enemy.w && laser.y > enemy.y && laser.y < enemy.y + enemy.h) {
                    enemy.alive = false;
                    lasers.splice(lIdx, 1);
                    spaceScore += 10;
                }
            });

            // Kollision mit Spieler oder Boden
            if(enemy.y + enemy.h >= player.y) {
                spaceGameOver = true;
            }
        });

        if(activeEnemies === 0) {
            spaceGameOver = true; // Gewonnen ist hier auch vorbei
        }

        // Score
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Score: ${spaceScore}`, 20, 30);

        spaceLoopId = requestAnimationFrame(runSpaceGame);
    }

    // Drag-and-Drop (Fenster bewegen) Feature für iPad OS Feeling
    document.querySelectorAll('.app-header').forEach(header => {
        header.onmousedown = function(e) {
            const win = header.parentElement;
            topZIndex++;
            win.style.zIndex = topZIndex;

            let shiftX = e.clientX - win.getBoundingClientRect().left;
            let shiftY = e.clientY - win.getBoundingClientRect().top;

            function moveAt(clientX, clientY) {
                let screenRect = document.getElementById('screen').getBoundingClientRect();
                let x = clientX - screenRect.left - shiftX;
                let y = clientY - screenRect.top - shiftY;
                win.style.left = x + 'px';
                win.style.top = y + 'px';
            }

            function onMouseMove(e) { moveAt(e.clientX, e.clientY); }
            document.addEventListener('mousemove', onMouseMove);

            document.onmouseup = function() {
                document.removeEventListener('mousemove', onMouseMove);
                document.onmouseup = null;
            };
        };
        header.ondragstart = function() { return false; };
    });
</script>

</body>
</html>
