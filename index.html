<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPadOS Pro - Developer & Multi-Chat Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        :root {
            --bg-url: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200');
            --tint-color: #007aff;
            --window-bg: #ffffff;
            --window-text: #111111;
            --sidebar-bg: #f2f2f7;
            --card-bg: rgba(150,150,150,0.1);
        }

        body {
            background: #0f1013;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #ipad {
            width: 1024px;
            height: 720px;
            background: #000;
            border-radius: 38px;
            padding: 15px;
            box-shadow: 0 35px 90px rgba(0,0,0,0.9);
            position: relative;
            border: 2px solid #252525;
        }

        @media (max-width: 1050px) {
            #ipad { width: 100vw; height: 100vh; border-radius: 0; padding: 0; border: none; }
            #screen { border-radius: 0 !important; }
        }

        #screen {
            width: 100%;
            height: 100%;
            background: var(--bg-url) center/cover;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        #status-bar {
            height: 38px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 13px;
            font-weight: 600;
            z-index: 10000;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        /* LOCKSCREEN */
        #lockscreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s;
        }
        #lock-time { font-size: 74px; font-weight: 200; margin-top: -40px; }
        #lock-date { font-size: 20px; font-weight: 400; margin-bottom: 40px; opacity: 0.9; }
        
        .auth-container {
            background: rgba(255,255,255,0.12);
            padding: 24px;
            border-radius: 20px;
            width: 320px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .auth-container h3 { margin-bottom: 15px; font-weight: 500; }
        .auth-input {
            width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.2); color: white; font-size: 15px; outline: none; text-align: center;
            user-select: text; -webkit-user-select: text;
        }
        .auth-input::placeholder { color: rgba(255,255,255,0.6); }
        .auth-btn {
            width: 100%; padding: 12px; background: var(--tint-color); color: white;
            border: none; border-radius: 10px; font-weight: 600; margin-top: 12px; cursor: pointer;
        }
        .auth-toggle { font-size: 13px; margin-top: 12px; color: #a2a2a7; cursor: pointer; text-decoration: underline; display: inline-block; }

        /* Homescreen */
        #homescreen {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 110px;
            grid-gap: 30px;
            padding: 40px 60px;
            flex-grow: 1;
            align-content: flex-start;
            position: relative;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            width: 90px;
            justify-self: center;
        }
        .appstore-logo-css {
            width: 72px; height: 72px;
            background: linear-gradient(180deg, #34a4fe, #0072ff);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .appstore-logo-css::before, .appstore-logo-css::after, .appstore-logo-css .stick-3 {
            content: ''; position: absolute; width: 38px; height: 7px; background: white; border-radius: 4px;
        }
        .appstore-logo-css::before { transform: rotate(-60deg) translate(-2px, -7px); }
        .appstore-logo-css::after { transform: rotate(60deg) translate(2px, -7px); }
        .appstore-logo-css .stick-3 { transform: rotate(0deg) translate(0px, 6px); }

        .app-icon img {
            width: 72px; height: 72px; border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); margin-bottom: 8px; object-fit: cover;
        }
        .app-icon span {
            color: white; font-size: 12px; font-weight: 500; text-align: center;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8); width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        @keyframes jiggle {
            0% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(-1.5deg); }
        }
        .wiggling { animation: jiggle 0.25s infinite ease-in-out; }
        .delete-badge {
            position: absolute; top: -6px; left: -6px; background: #ff3b30; color: white;
            width: 22px; height: 22px; border-radius: 50%; display: none; justify-content: center;
            align-items: center; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10;
        }
        .wiggling .delete-badge { display: flex; }
        .dragging { opacity: 0.4; transform: scale(1.1); z-index: 9999; }

        /* Dock */
        #dock-container { width: 100%; display: flex; justify-content: center; position: absolute; bottom: 20px; z-index: 999; }
        #dock {
            background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 10px 24px; border-radius: 26px; display: flex; gap: 16px; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); min-width: 200px;
        }
        #dock .app-icon img, #dock .appstore-logo-css { width: 64px; height: 64px; margin-bottom: 0; }

        /* Fenster */
        .app-window {
            position: absolute; top: 5%; left: 5%; width: 90%; height: 86%;
            background: var(--window-bg); color: var(--window-text); border-radius: 18px;
            z-index: 100; display: none; flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4); overflow: hidden;
            opacity: 0; transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.25s;
        }
        .app-window.active { opacity: 1; transform: scale(1); display: flex; }
        .app-header {
            height: 52px; background: rgba(150,150,150,0.08); border-bottom: 1px solid rgba(150,150,150,0.15);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }
        .win-close { background: #ff5f56; width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; }
        .app-title { font-size: 16px; font-weight: 600; }

        /* Settings Split View Layout */
        .settings-container { display: flex; height: 100%; width: 100%; }
        .settings-sidebar { width: 250px; background: var(--sidebar-bg); border-right: 1px solid rgba(150,150,150,0.2); padding: 10px; }
        .settings-content { flex-grow: 1; padding: 30px; overflow-y: auto; background: #ffffff; }
        .sidebar-item { padding: 12px 16px; border-radius: 10px; margin-bottom: 4px; font-weight: 500; color: #111; cursor: pointer; }
        .sidebar-item.active { background: var(--tint-color); color: white; }
        .dev-credentials-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .dev-credentials-table th, .dev-credentials-table td { text-align: left; padding: 12px; border-bottom: 1px solid #e5e5ea; }
        .dev-credentials-table th { background: #f2f2f7; font-weight: 600; }
    </style>
</head>
<body>

<div id="ipad">
    <div id="screen">
        <!-- Status Bar -->
        <div id="status-bar">
            <span id="status-time">09:41</span>
            <span>📶 🪫 100%</span>
        </div>

        <!-- Lockscreen -->
        <div id="lockscreen">
            <div id="lock-time">09:41</div>
            <div id="lock-date">Donnerstag, 21. Mai</div>
            
            <!-- Login Box -->
            <div class="auth-container" id="login-box">
                <h3 id="auth-title">iPad Login</h3>
                <input type="text" id="username-input" class="auth-input" placeholder="Benutzername">
                <input type="password" id="password-input" class="auth-input" placeholder="Passwort">
                <button class="auth-btn" id="unlock-btn">Einloggen</button>
                <span class="auth-toggle" id="auth-toggle-btn" onclick="toggleAuthMode()">Neuen Account erstellen</span>
            </div>
        </div>

        <!-- Homescreen -->
        <div id="homescreen">
            <div class="app-icon" draggable="true" data-app="appstore">
                <div class="delete-badge">−</div>
                <div class="appstore-logo-css"></div>
                <span>App Store</span>
            </div>
        </div>

        <!-- Dock -->
        <div id="dock-container">
            <div id="dock">
                <div class="app-icon" data-app="settings">
                    <img src="https://unsplash.com" alt="Einstellungen">
                </div>
            </div>
        </div>

        <!-- App Store Fenster -->
        <div class="app-window" id="win-appstore">
            <div class="app-header">
                <button class="win-close" onclick="closeApp('appstore')"></button>
                <div class="app-title">App Store</div>
                <div style="width:13px"></div>
            </div>
            <div style="padding: 20px; overflow-y: auto; flex-grow: 1;">
                <h2>Willkommen im App Store</h2>
                <p>Entdecke neue Developer-Tools.</p>
            </div>
        </div>

        <!-- Einstellungen Fenster -->
        <div class="app-window" id="win-settings">
            <div class="app-header">
                <button class="win-close" onclick="closeApp('settings')"></button>
                <div class="app-title">Einstellungen</div>
                <div style="width:13px"></div>
            </div>
            <div class="settings-container">
                <div class="settings-sidebar">
                    <div class="sidebar-item active" onclick="switchSettingsTab('allgemein')">⚙️ Allgemein</div>
                    <div class="sidebar-item" id="dev-tab" style="display: none; color: #ff9500; font-weight: bold;" onclick="switchSettingsTab('dev')">🔑 Dev-Passwörter</div>
                </div>
                <div class="settings-content">
                    <div id="tab-allgemein">
                        <h2>Allgemein</h2>
                        <p style="margin-top: 10px; color: #666;" id="welcome-user">Eingeloggt als: Gast</p>
                    </div>
                    <div id="tab-dev" style="display:none;">
                        <h2>Entwickler-Datenbank</h2>
                        <table class="dev-credentials-table">
                            <thead>
                                <tr><th>User</th><th>Passwort</th></tr>
                            </thead>
                            <tbody id="credentials-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // Systemdatenbank initialisieren
    if (!localStorage.getItem('ipad_users')) {
        localStorage.setItem('ipad_users', JSON.stringify({"jonas": "jonas1234", "admin": "admin2026"}));
    }

    let isRegisterMode = false;

    function updateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('status-time').innerText = timeStr;
        document.getElementById('lock-time').innerText = timeStr;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Umschalten Login / Registrieren
    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "Account erstellen" : "iPad Login";
        document.getElementById('unlock-btn').innerText = isRegisterMode ? "Registrieren & Einloggen" : "Einloggen";
        document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? "Zurück zum Login" : "Neuen Account erstellen";
    }

    // Login & Registrierungs-Verarbeitung
    document.getElementById('unlock-btn').addEventListener('click', () => {
        const user = document.getElementById('username-input').value.trim().toLowerCase();
        const pass = document.getElementById('password-input').value.trim();

        if (!user || !pass) {
            alert("Bitte alle Felder ausfüllen!");
            return;
        }

        let db = JSON.parse(localStorage.getItem('ipad_users'));

        if (isRegisterMode) {
            // Prüfung auf Einzigartigkeit des Namens
            if (db.hasOwnProperty(user)) {
                alert(`Der Name "${user}" existiert bereits!`);
                return;
            }
            db[user] = pass;
            localStorage.setItem('ipad_users', JSON.stringify(db));
            alert("Account erstellt!");
        } else {
            if (!db.hasOwnProperty(user) || db[user] !== pass) {
                alert("Falsche Anmeldedaten!");
                return;
            }
        }

        // Einloggen
        document.getElementById('welcome-user').innerText = `Eingeloggt als: ${user.toUpperCase()}`;
        if (user === "jonas") {
            document.getElementById('dev-tab').style.display = 'block';
            const list = document.getElementById('credentials-list');
            list.innerHTML = "";
            for (const [u, p] of Object.entries(db)) {
                list.innerHTML += `<tr><td>${u}</td><td style="color:#ff3b30; font-family:monospace;">${p}</td></tr>`;
            }
        } else {
            document.getElementById('dev-tab').style.display = 'none';
        }

        const ls = document.getElementById('lockscreen');
        ls.style.transform = 'translateY(-100%)';
        ls.style.opacity = '0';
        setTimeout(() => ls.style.display = 'none', 400);
    });

    function switchSettingsTab(tabName) {
        document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
        document.getElementById('tab-allgemein').style.display = 'none';
        document.getElementById('tab-dev').style.display = 'none';
        event.currentTarget.classList.add('active');
        document.getElementById(`tab-${tabName}`).style.display = 'block';
    }

    // App Logik (Original-Struktur beibehalten)
    document.querySelectorAll('.app-icon').forEach(icon => {
        icon.addEventListener('click', () => {
            if (document.body.classList.contains('edit-mode')) return;
            const appId = icon.getAttribute('data-app');
            const win = document.getElementById(`win-${appId}`);
            if (win) {
                win.style.display = 'flex';
                setTimeout(() => win.classList.add('active'), 10);
            }
        });
    });

    function closeApp(appId) {
        const win = document.getElementById(`win-${appId}`);
        if (win) {
            win.classList.remove('active');
            setTimeout(() => win.style.display = 'none', 250);
        }
    }
</script>

</body>
</html>
