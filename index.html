<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothub Love Finder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Special+Elite&display=swap');

        body {
            background-color: #0d0d0d;
            background-image: radial-gradient(circle, #1a0011 0%, #050505 100%);
            color: #e0e0e0;
            font-family: 'Special Elite', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(15, 15, 15, 0.85);
            border: 2px solid #660011;
            box-shadow: 0 0 25px #440000, inset 0 0 15px #220000;
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #990011;
            text-shadow: 0 0 10px #ff0033, 0 0 20px #000;
            margin-top: 0;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #aa66cc;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #151515;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-family: 'Special Elite', monospace;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #990011;
            box-shadow: 0 0 10px #550000;
        }

        button {
            background: linear-gradient(45deg, #440000, #880011);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #330000;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(45deg, #660011, #cc0022);
            box-shadow: 0 0 15px #990011;
            letter-spacing: 1px;
        }

        /* --- Animationen & Resultat --- */

        .heart-icon {
            font-size: 3rem;
            color: #440000;
            margin: 20px 0;
            transition: all 0.5s ease;
        }

        .pulse {
            animation: heartBeat 1.2s infinite;
            color: #990011 !important;
            text-shadow: 0 0 15px #ff0033;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.15); }
            40% { transform: scale(1); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .loader {
            display: none;
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #990011;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #result-container {
            display: none;
            margin-top: 25px;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .percentage {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: #ff0033;
            text-shadow: 0 0 10px #660011;
            margin: 10px 0;
        }

        .quote {
            font-style: italic;
            color: #bbb;
            font-size: 1rem;
            line-height: 1.4;
            padding: 0 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gothub Love Finder</h1>
    <div class="subtitle">Berechne die seelische Finsternis eurer Liebe</div>
    
    <div class="input-group">
        <label for="name1">Dein Name (oder Fledermaus 1):</label>
        <input type="text" id="name1" placeholder="z.B. Morticia" autocomplete="off">
    </div>
    
    <div class="input-group">
        <label for="name2">Name des Opfers (oder Fledermaus 2):</label>
        <input type="text" id="name2" placeholder="z.B. Gomez" autocomplete="off">
    </div>
    
    <button onclick="calculateLove()">Ritual starten</button>

    <div class="heart-icon" id="heart">🖤</div>
    <div class="loader" id="loader"></div>

    <div id="result-container">
        <div class="percentage" id="percent">0%</div>
        <div class="quote" id="goth-quote">"Spruch lädt..."</div>
    </div>
</div>

<script>
function calculateLove() {
    const name1 = document.getElementById('name1').value.trim();
    const name2 = document.getElementById('name2').value.trim();
    
    if (name1 === "" || name2 === "") {
        alert("Bitte gib beide Namen ein, sonst verhungern die Krähen!");
        return;
    }

    // Reset & Start Animationen
    document.getElementById('result-container').style.display = 'none';
    document.getElementById('heart').classList.remove('pulse');
    document.getElementById('heart').innerHTML = "🖤";
    document.getElementById('loader').style.display = 'block';

    // Fake-Berechnung (2 Sekunden "Ritual"-Dauer)
    setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        
        // Generiere einen festen Wert basierend auf den Namen (damit bei gleichen Namen immer das gleiche rauskommt)
        const combinedString = (name1 + name2).toLowerCase().sortString();
        let hash = 0;
        for (let i = 0; i < combinedString.length; i++) {
            hash += combinedString.charCodeAt(i);
        }
        const percentage = hash % 101; // Wert zwischen 0 und 100

        // Herz-Animation triggern
        const heart = document.getElementById('heart');
        heart.classList.add('pulse');
        
        if(percentage > 50) {
            heart.innerHTML = "❤️"; // Rotes Herz bei viel Liebe
        } else {
            heart.innerHTML = "💔"; // Gebrochenes Herz bei wenig Liebe
        }

        // Spruch auswählen
        let quote = "";
        if (percentage <= 20) {
            quote = `"Ein absoluter Albtraum. Eure Seelen meiden sich selbst im tiefsten Schatten. Geht euch lieber aus dem Weg."`;
        } else if (percentage <= 40) {
            quote = `"Kaum synchrone Herzschläge. Es reicht maximal für ein gemeinsames Schweigen auf dem Friedhof."`;
        } else if (percentage <= 65) {
            quote = `"Eine düstere Melancholie verbindet euch. Nicht perfekt, aber genug Verzweiflung für eine Weile."`;
        } else if (percentage <= 85) {
            quote = `"Eure Seelen tanzen im Rhythmus der Nacht. Eine starke, mystische Anziehungskraft liegt in der Luft."`;
        } else {
            quote = `"Bis dass der Tod euch scheidet? Lächerlich. Eure Liebe überdauert die Ewigkeit. Perfekte gothische Symbiose."`;
        }

        // Ergebnisse anzeigen
        document.getElementById('percent').innerText = percentage + "%";
        document.getElementById('goth-quote').innerHTML = quote;
        document.getElementById('result-container').style.display = 'block';

    }, 2000);
}

// Hilfsfunktion, damit die Reihenfolge der Namen egal ist (A + B ergibt dasselbe wie B + A)
String.prototype.sortString = function() {
    return this.split('').sort().join('');
};
</script>

</body>
</html>
