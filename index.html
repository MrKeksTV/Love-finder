<script>

// 🔥 FIXE MATCHES
const fixed = {
  "eko-mia": 99,
  "maefin-mia": 99
};

// 🔢 stabiler Hash (immer gleiche Ergebnisse)
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash * 31 + str.charCodeAt(i)) % 1000;
  }
  return Math.abs(hash);
}

// ❤️ Herzen
function hearts() {
  for (let i = 0; i < 20; i++) {
    let h = document.createElement("div");
    h.innerHTML = "💖";
    h.className = "heart";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 5000);
  }
}

// 🎉 Konfetti
function confetti() {
  for (let i = 0; i < 40; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = ["#ff2e63","#ffcc00","#00e5ff","#9d4edd","#ff6b81"][Math.floor(Math.random()*5)];
    c.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function calculate() {

  let n1 = document.getElementById("name1").value.trim().toLowerCase();
  let n2 = document.getElementById("name2").value.trim().toLowerCase();
  let result = document.getElementById("result");

  if (!n1 || !n2) {
    result.innerHTML = "⚠️ Bitte beide Namen eingeben";
    return;
  }

  if (n1 === n2) {
    result.innerHTML = "💘 100% Seelenverwandt ❤️";
    hearts();
    confetti();
    return;
  }

  let sorted = [n1, n2].sort();
  let key = sorted[0] + "-" + sorted[1];

  // 🎰 SPANNUNGSEFFEKT
  let counter = 0;

  let interval = setInterval(() => {

    let fake = Math.floor(Math.random() * 101);
    result.innerHTML = "💘 " + fake + "%";

    counter++;

    if (counter > 25) {
      clearInterval(interval);

      let percent;

      // 💘 FIXED MATCH
      if (fixed[key] !== undefined) {
        percent = fixed[key];
      } else {
        let combined = sorted[0] + sorted[1];
        percent = 60 + (hashCode(combined) % 41);
      }

      result.innerHTML =
        "💘 <span style='font-size:40px'>" + percent + "%</span>";

      // ❤️ Effekte
      for (let i = 0; i < 25; i++) hearts();
      confetti();
    }

  }, 70);
}

</script>
