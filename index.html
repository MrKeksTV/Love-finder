<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPadOS Pro - Developer & Multi-Chat Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        :root {
            --bg-url: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200');
            --tint-color: #007aff;
            --window-bg: #ffffff;
            --window-text: #111111;
            --sidebar-bg: #f2f2f7;
            --card-bg: rgba(150,150,150,0.1);
        }
        body {
            background: #0f1013;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #ipad {
            width: 1024px;
            height: 720px;
            background: #000;
            border-radius: 38px;
            padding: 15px;
            box-shadow: 0 35px 90px rgba(0,0,0,0.9);
            position: relative;
            border: 2px solid #252525;
        }
        @media (max-width: 1050px) {
            #ipad {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                border: none;
            }
            #screen {
                border-radius: 0 !important;
            }
        }
        #screen {
            width: 100%;
            height: 100%;
            background: var(--bg-url) center/cover;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }
        #status-bar {
            height: 38px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 13px;
            font-weight: 600;
            z-index: 10000;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        /* LOCKSCREEN */
        #lockscreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s;
        }
        #lock-time {
            font-size: 74px;
            font-weight: 200;
            margin-top: -40px;
        }
        #lock-date {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .auth-container {
            background: rgba(255,255,255,0.12);
            padding: 24px;
            border-radius: 20px;
            width: 320px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .auth-container h3 {
            margin-bottom: 15px;
            font-weight: 500;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 15px;
            outline: none;
            text-align: center;
        }
        .auth-input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--tint-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
        }
        .auth-toggle {
            font-size: 13px;
            margin-top: 12px;
            color: #a2a2a7;
            cursor: pointer;
            text-decoration: underline;
        }
        /* Homescreen */
        #homescreen {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 110px;
            grid-gap: 30px;
            padding: 40px 60px;
            flex-grow: 1;
            align-content: flex-start;
            position: relative;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            width: 90px;
            justify-self: center;
        }
        .appstore-logo-css {
            width: 72px;
            height: 72px;
            background: linear-gradient(180deg, #34a4fe, #0072ff);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .appstore-logo-css::before, .appstore-logo-css::after, .appstore-logo-css .stick-3 {
            content: '';
            position: absolute;
            width: 38px;
            height: 7px;
            background: white;
            border-radius: 4px;
        }
        .appstore-logo-css::before {
            transform: rotate(-60deg) translate(-2px, -7px);
        }
        .appstore-logo-css::after {
            transform: rotate(60deg) translate(2px, -7px);
        }
        .appstore-logo-css .stick-3 {
            transform: rotate(0deg) translate(0px, 6px);
        }
        .app-icon img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin-bottom: 8px;
            object-fit: cover;
        }
        .app-icon span {
            color: white;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @keyframes jiggle {
            0% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(-1.5deg); }
        }
        .wiggling {
            animation: jiggle 0.25s infinite ease-in-out;
        }
        .delete-badge {
            position: absolute;
            top: -6px;
            left: -6px;
            background: #ff3b30;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .wiggling .delete-badge {
            display: flex;
        }
        .dragging {
            opacity: 0.4;
            transform: scale(1.1);
            z-index: 9999;
        }
        /* Dock */
        #dock-container {
            width: 100%;
            display: flex;
            justify-content: center;
            position: absolute;
            bottom: 20px;
            z-index: 999;
        }
        #dock {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 10px 24px;
            border-radius: 26px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 200px;
        }
        #dock .app-icon img, #dock .appstore-logo-css {
            width: 64px;
            height: 64px;
            margin-bottom: 0;
        }
        /* Fenster */
        .app-window {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 86%;
            background: var(--window-bg);
            color: var(--window-text);
            border-radius: 18px;
            z-index: 100;
            display: none;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.25s;
        }
        .app-window.active {
            opacity: 1;
            transform: scale(1);
        }
        .app-header {
            height: 52px;
            background: rgba(150,150,150,0.08);
            border-bottom: 1px solid rgba(150,150,150,0.15);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }
        .win-close {
            background: #ff5f56;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        .app-title {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="ipad">
        <div id="screen">
            
            <!-- STATUS BAR -->
            <div id="status-bar">
                <span id="status-time">09:41</span>
                <span id="status-icons"> Wi-Fi 100%</span>
            </div>

            <!-- LOCKSCREEN -->
            <div id="lockscreen">
                <div id="lock-time">09:41</div>
                <div id="lock-date">Donnerstag, 21. Mai</div>
                <div class="auth-container">
                    <h3>Anmelden</h3>
                    <input type="password" class="auth-input" placeholder="Code eingeben">
                    <button class="auth-btn">Entsperren</button>
                </div>
            </div>

            <!-- HOMESCREEN -->
            <div id="homescreen">
                <!-- App Icons werden per JS oder manuell eingefügt -->
            </div>

            <!-- APP WINDOW -->
            <div class="app-window">
                <div class="app-header">
                    <button class="win-close"></button>
                    <div class="app-title">Anwendung</div>
                    <div style="width: 13px;"></div>
                </div>
            </div>

            <!-- DOCK CONTAINER -->
            <div id="dock-container">
                <div id="dock">
                    <!-- App Icons im Dock -->
                </div>
            </div>

        </div>
    </div>

</body>
</html>
