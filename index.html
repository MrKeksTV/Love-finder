```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lover Finder 💘</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
height:100vh;
display:grid;
place-items:center;
overflow:hidden;

background:
radial-gradient(circle at top left,#ff6b81 0%,transparent 40%),
radial-gradient(circle at bottom right,#8e44ff 0%,transparent 35%),
linear-gradient(135deg,#170018,#090014);
}

/* SPLASH */

#splash{
position:fixed;
inset:0;
background:#fff;

display:grid;
place-items:center;

font-size:80px;

z-index:999;
transition:1s;
}

#splash.hide{
opacity:0;
transform:scale(1.2);
pointer-events:none;
}

/* CARD */

.container{

width:min(92vw,420px);

padding:38px;

border-radius:32px;

background:
rgba(255,255,255,.08);

backdrop-filter:
blur(24px);

border:
1px solid rgba(255,255,255,.18);

box-shadow:
0 30px 70px rgba(0,0,0,.4);

color:white;

text-align:center;

animation:
appear .8s ease;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:none;
}
}

.logo{
font-size:58px;
margin-bottom:10px;
}

h1{
font-size:34px;
margin-bottom:8px;
}

.subtitle{
opacity:.7;
margin-bottom:28px;
}

/* INPUT */

.input{
margin-bottom:14px;
position:relative;
}

input{
width:100%;

padding:16px;

border-radius:18px;

border:1px solid rgba(255,255,255,.15);

background:
rgba(255,255,255,.08);

color:white;

outline:none;

font-size:15px;

transition:.25s;
}

input::placeholder{
color:#ddd;
}

input:focus{
border-color:#ff8fb0;

background:
rgba(255,255,255,.12);

transform:translateY(-2px);
}

/* BUTTON */

button{

width:100%;

padding:16px;

border:none;

border-radius:18px;

background:
linear-gradient(
90deg,
#ff4d88,
#ff758c
);

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;
}

button:hover{
transform:
translateY(-3px);

box-shadow:
0 14px 30px
rgba(255,80,120,.45);
}

/* RESULT */

.result{

margin-top:30px;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

gap:10px;

min-height:160px;
}

.circle{

width:140px;

height:140px;

border-radius:50%;

display:grid;

place-items:center;

background:
conic-gradient(
#ff5c8d var(--p),
rgba(255,255,255,.08) 0
);

position:relative;
}

.circle::before{

content:"";

position:absolute;

inset:10px;

border-radius:50%;

background:#180018;

}

.percent{

position:relative;

font-size:34px;

font-weight:700;
}

.label{
opacity:.85;
}

/* HEARTS */

.heart{
position:fixed;

top:-20px;

font-size:20px;

animation:fall linear forwards;
}

@keyframes fall{
to{
transform:
translateY(110vh)
rotate(360deg);

opacity:0;
}
}

/* CONFETTI */

.confetti{
position:fixed;

width:8px;
height:8px;

animation:confetti 3s linear forwards;
}

@keyframes confetti{
to{
transform:
translateY(110vh)
rotate(720deg);

opacity:0;
}
}

</style>
</head>

<body>

<div id="splash">
💘
</div>

<div class="container">

<div class="logo">
💘
</div>

<h1>Lover Finder</h1>

<div class="subtitle">
Finde eure Love-Energie
</div>

<div class="input">
<input id="name1" placeholder="Dein Name">
</div>

<div class="input">
<input id="name2" placeholder="Crush Name">
</div>

<button onclick="calculate()">
Match berechnen
</button>

<div class="result" id="result"></div>

</div>

<script>

window.onload=()=>{

setTimeout(()=>{

splash.classList.add("hide");

setTimeout(
()=>splash.remove(),
900
);

},1200);

};

const fixed={
"eko-mia":99,
"Jonas-Ravza":97
};

function hashCode(str){

let hash=0;

for(let c of str)
hash=
(hash*31+
c.charCodeAt(0))
%1000;

return Math.abs(hash);

}

function hearts(){

for(let i=0;i<18;i++){

let h=
document.createElement("div");

h.className="heart";

h.innerHTML=
["💖","💘","💕"]
[Math.floor(Math.random()*3)];

h.style.left=
Math.random()*100+"vw";

h.style.animationDuration=
Math.random()*3+2+"s";

document.body.appendChild(h);

setTimeout(
()=>h.remove(),
5000
);

}

}

function confetti(){

const colors=[
"#ff5c8d",
"#ffd43b",
"#00d4ff",
"#9d4edd",
"#ffffff"
];

for(let i=0;i<60;i++){

let c=
document.createElement("div");

c.className=
"confetti";

c.style.left=
Math.random()*100+"vw";

c.style.background=
colors[
Math.floor(
Math.random()*5
)];

document.body.appendChild(c);

setTimeout(
()=>c.remove(),
3500
);

}

}

function showResult(percent){

result.innerHTML=`

<div class="circle"
style="--p:${percent}%">

<div class="percent">
${percent}%
</div>

</div>

<div class="label">
Love Match
</div>

`;

}

function calculate(){

let n1=
name1.value
.trim()
.toLowerCase();

let n2=
name2.value
.trim()
.toLowerCase();

if(!n1||!n2){

result.innerHTML=
"⚠️ Beide Namen eingeben";

return;

}

if(n1===n2){

showResult(100);

hearts();

confetti();

return;

}

let sorted=
[n1,n2].sort();

let key=
sorted.join("-");

let count=0;

let spin=
setInterval(()=>{

showResult(
Math.floor(
Math.random()*100
)
);

count++;

if(count>18){

clearInterval(spin);

let percent=
fixed[key]
??(
60+
hashCode(
sorted.join("")
)%41
);

showResult(
percent
);

hearts();

confetti();

}

},80);

}

</script>

</body>
</html>
```
