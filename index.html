<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator by jonas</title>
    <style>
        body { 
            font-family: 'segoe ui', tahoma, geneva, verdana, sans-serif; 
            background: linear-gradient(135deg, #7303c0 0%, #ec38bc 50%, #fdeff9 100%); 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .box { 
            background: rgba(0, 0, 0, 0.8); 
            padding: 2.5rem; 
            border-radius: 20px; 
            backdrop-filter: blur(15px); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            max-width: 450px; 
            width: 100%; 
        }
        h2 { 
            margin-top: 0; 
            color: #ff758c; 
            font-size: 2rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 25px;
        }
        .input-container { 
            margin: 15px 0; 
        }
        input { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            font-size: 1.1rem; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            text-align: center; 
            transition: all 0.3s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #ff758c; 
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.3);
        }
        .heart-icon {
            font-size: 2.5rem;
            color: #ff758c;
            margin: 10px 0;
            display: inline-block;
            transition: transform 0.8s ease;
        }
        .rotate-heart {
            transform: rotate(360deg) scale(1.3);
        }
        button { 
            background: linear-gradient(45deg, #ff758c, #ff7eb3); 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 1.1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); 
            margin-top: 15px; 
            transition: all 0.2s ease;
        }
        button:hover { 
            background: linear-gradient(45deg, #ff5e7e, #ff6b97); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }
        .result-display {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
        .percentage {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff758c;
            margin: 5px 0;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
        }
        .verdict {
            font-size: 1rem;
            line-height: 1.4;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Love Calculator</h2>
        <p class="subtitle">by jonas</p>
        
        <div class="input-container">
            <input type="text" id="name1" placeholder="Name der 1. Person..." autocomplete="off">
        </div>

        <div class="heart-icon" id="heart">❤️</div>

        <div class="input-container">
            <input type="text" id="name2" placeholder="Name der 2. Person..." autocomplete="off">
        </div>

        <button id="calc-button">Berechnen</button>

        <div class="result-display" id="result-box">
            <div id="result-names" style="font-weight: bold; font-size: 1.1rem;"></div>
            <div class="percentage" id="result-percent">0%</div>
            <div class="verdict" id="result-text">Ein perfektes Match!</div>
        </div>
    </div>

    <script>
        const name1Input = document.getElementById('name1');
        const name2Input = document.getElementById('name2');
        const heartIcon = document.getElementById('heart');
        const calcButton = document.getElementById('calc-button');
        const resultBox = document.getElementById('result-box');
        const resultNames = document.getElementById('result-names');
        const resultPercent = document.getElementById('result-percent');
        const resultText = document.getElementById('result-text');

        calcButton.addEventListener('click', () => {
            const n1 = name1Input.value.trim();
            const n2 = name2Input.value.trim();

            if (!n1 || !n2) {
                alert("Bitte gib beide Namen ein!");
                return;
            }

            // Herz-Animation starten
            heartIcon.classList.add('rotate-heart');
            resultBox.style.display = 'none';

            setTimeout(() => {
                heartIcon.classList.remove('rotate-heart');
                
                const n1Lower = n1.toLowerCase();
                const n2Lower = n2.toLowerCase();
                
                let prozent = 0;
                let spruch = "";

                // --- SONDERREGEL FÜR JONAS & MIA ---
                if ((n1Lower === "jonas" && n2Lower === "mia") || (n1Lower === "mia" && n2Lower === "jonas")) {
                    prozent = 0;
                    spruch = "❄️ Absolut unmöglich! Ihr passt wie Feuer und Wasser zusammen... Gar nicht! ❄️";
                } else {
                    // Normale mathematische Berechnung für alle anderen Namen
                    const kombiniert = (n1 + n2).toLowerCase().replace(/\s/g, "");
                    let summe = 0;
                    for (let i = 0; i < kombiniert.length; i++) {
                        summe += kombiniert.charCodeAt(i);
                    }
                    prozent = 30 + (summe % 71); 

                    if (prozent >= 90) {
                        spruch = "✨ Absolute Seelenverwandte! Ihr passt perfekt zusammen! ✨";
                    } else if (prozent >= 75) {
                        spruch = "❤️ Große Liebe im Anflug! Da funkt es gewaltig!";
                    } else if (prozent >= 50) {
                        spruch = "👀 Es gibt eine gute Chance! Probiert es einfach aus!";
                    } else {
                        spruch = "⚡️ Na ja... Freundschaftszone wäre vielleicht sicherer!";
                    }
                }

                // Ergebnisse anzeigen
                resultNames.innerText = `${n1} + ${n2}`;
                resultPercent.innerText = `${prozent}%`;
                resultText.innerHTML = spruch;
                resultBox.style.display = 'block';

            }, 800);
        });
    </script>
</body>
</html>
